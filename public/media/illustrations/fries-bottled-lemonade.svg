<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img" aria-labelledby="t d" data-illustration="fries-bottled-lemonade" data-lemonade="bottle">
  <title id="t">Illustration: fries and bottled lemonade</title>
  <desc id="d">Stylized illustration, not a photograph. A red tray of golden fries beside a sealed bottle of lemonade with a blank label, on red-and-white checkered paper.</desc>
  <defs>
    <pattern id="fl-checker" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(6)"><rect width="40" height="40" fill="#fffdf8"/><rect width="20" height="20" fill="#e51b2b"/><rect x="20" y="20" width="20" height="20" fill="#e51b2b"/></pattern>
    <linearGradient id="fl-drink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd84d"/><stop offset=".5" stop-color="#fff0a3"/><stop offset="1" stop-color="#f3c535"/></linearGradient>
    <linearGradient id="fl-fry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd477"/><stop offset="1" stop-color="#e2a13c"/></linearGradient>
  </defs>
  <rect width="460" height="400" fill="#211919"/>
  <path d="M0 290 460 262V400H0z" fill="url(#fl-checker)"/>
  <!-- fries -->
  <g fill="url(#fl-fry)" stroke="#c98a2e" stroke-width="2">
    <rect x="70" y="150" width="18" height="130" rx="4" transform="rotate(-14 79 215)"/>
    <rect x="98" y="136" width="18" height="140" rx="4" transform="rotate(-5 107 206)"/>
    <rect x="126" y="130" width="18" height="146" rx="4" transform="rotate(4 135 203)"/>
    <rect x="152" y="140" width="18" height="136" rx="4" transform="rotate(12 161 208)"/>
    <rect x="178" y="156" width="18" height="120" rx="4" transform="rotate(20 187 216)"/>
    <rect x="112" y="160" width="18" height="120" rx="4" transform="rotate(-22 121 220)"/>
  </g>
  <path d="M56 206h164l-18 112H74z" fill="#e51b2b"/>
  <path d="M56 206h164l-4 22H60z" fill="#c8102e"/>
  <!-- bottled lemonade: sealed bottle with cap, blank label -->
  <g data-drink="bottle">
    <rect x="300" y="64" width="44" height="24" rx="5" fill="#fffdf8"/>
    <rect x="300" y="84" width="44" height="6" fill="#d9cdbd"/>
    <path d="M306 90h32v34q0 12 14 26q18 18 18 44v112q0 16-16 16h-66q-16 0-16-16V194q0-26 18-44q14-14 14-26z" fill="#dfe9ec" opacity=".55" stroke="#fffdf8" stroke-width="3"/>
    <path d="M296 176h52q14 12 14 24v106q0 10-10 10h-60q-10 0-10-10V200q0-12 14-24z" fill="url(#fl-drink)"/>
    <rect x="283" y="214" width="78" height="56" fill="#fffdf8"/>
    <rect x="283" y="214" width="78" height="8" fill="#e51b2b"/>
    <path d="M300 110v50" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>
