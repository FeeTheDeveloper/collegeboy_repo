<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="scene-title scene-desc" data-scene="truck-service" data-people="2">
  <title id="scene-title">Illustration: College Boy truck open for service</title>
  <desc id="scene-desc">Stylized illustration, not a photograph. The red College Boy Cheesesteaks truck is parked at dusk with its service window open. A woman in a red head wrap leads at the window, setting a wrapped cheesesteak on the counter. Behind her, a Black man in a black cap works the flat-top grill. No one else is in the scene.</desc>
  <style>
    .steam{fill:none;stroke:#fffdf8;stroke-width:5;stroke-linecap:round;opacity:.0;animation:rise 3.6s ease-out infinite}
    .steam.s2{animation-delay:1.2s}.steam.s3{animation-delay:2.4s}
    @keyframes rise{0%{opacity:0;transform:translateY(8px)}30%{opacity:.55}100%{opacity:0;transform:translateY(-34px)}}
    @media (prefers-reduced-motion: reduce){.steam{animation:none;opacity:.35}}
    .sign{font-family:Anton,Impact,'Arial Black',sans-serif;fill:#fffdf8;letter-spacing:2px}
    .small{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;letter-spacing:3px}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1320"/><stop offset=".7" stop-color="#43222c"/><stop offset="1" stop-color="#5a2b2a"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0293a"/><stop offset=".6" stop-color="#e51b2b"/><stop offset="1" stop-color="#b8121f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d3a44"/><stop offset="1" stop-color="#11171c"/></linearGradient>
    <linearGradient id="kitchen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a6"/><stop offset="1" stop-color="#e9b76a"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f1"/><stop offset="1" stop-color="#9aa2a8"/></linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcc45" stop-opacity=".45"/><stop offset="1" stop-color="#ffcc45" stop-opacity="0"/></radialGradient>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fffdf8"/><rect width="8" height="8" fill="#e51b2b"/><rect x="8" y="8" width="8" height="8" fill="#e51b2b"/></pattern>
  </defs>

  <!-- Setting -->
  <rect width="1200" height="700" fill="url(#sky)"/>
  <rect y="575" width="1200" height="125" fill="#262022"/>
  <rect y="575" width="1200" height="6" fill="#3a3133"/>
  <path d="M0 650h140M220 650h140M440 650h140M660 650h140M880 650h140M1100 650h100" stroke="#6d6360" stroke-width="5"/>
  <ellipse cx="620" cy="600" rx="360" ry="34" fill="url(#pool)"/>

  <!-- Truck body -->
  <rect x="300" y="140" width="770" height="382" rx="18" fill="url(#body)"/>
  <rect x="300" y="498" width="770" height="26" fill="#130f0f"/>
  <!-- Cab -->
  <path d="M300 250H168q-20 0-30 18l-26 70v164h188z" fill="url(#body)"/>
  <path d="M292 266H176q-12 0-18 11l-24 72h158z" fill="url(#glass)"/>
  <path d="M292 266v83" stroke="#130f0f" stroke-width="6"/>
  <rect x="236" y="380" width="52" height="8" rx="4" fill="#130f0f"/>
  <rect x="100" y="490" width="206" height="32" rx="6" fill="#2b2527"/>
  <rect x="104" y="432" width="26" height="30" rx="6" fill="#ffe7a1"/>
  <rect x="100" y="470" width="14" height="10" rx="3" fill="#ffb347"/>
  <rect x="306" y="120" width="12" height="300" rx="6" fill="url(#steel)"/>
  <g fill="#ffb347"><rect x="360" y="134" width="18" height="8" rx="3"/><rect x="600" y="134" width="18" height="8" rx="3"/><rect x="840" y="134" width="18" height="8" rx="3"/><rect x="1030" y="134" width="18" height="8" rx="3"/></g>
  <path d="M150 524a70 70 0 0 1 140 0zM860 524a70 70 0 0 1 140 0z" fill="#130f0f"/>

  <!-- Signage (large display text on truck red: 4.6:1) -->
  <text class="sign" x="690" y="208" font-size="60" text-anchor="middle">COLLEGE BOY</text>
  <text class="small" x="690" y="236" font-size="22" text-anchor="middle" fill="#fffdf8">CHEESESTEAKS</text>

  <!-- Awning -->
  <path d="M400 256h460l24 42H376z" fill="#fffdf8"/>
  <path d="M400 256h46l-6 42h-64zM492 256h46l-2 42h-54zM584 256h46v42h-46zM676 256h46l2 42h-48zM768 256h46l6 42h-48zM856 256h4l24 42h-22z" fill="#e51b2b"/>

  <!-- Service window and kitchen -->
  <rect x="402" y="290" width="456" height="168" fill="#55504e"/>
  <rect x="410" y="298" width="440" height="152" fill="url(#kitchen)"/>
  <rect x="410" y="298" width="440" height="16" fill="#c9cfd3"/>
  <rect x="700" y="314" width="140" height="26" fill="#aeb5ba"/>
  <!-- Person 2: Black man working the grill -->
  <g data-person="worker" aria-label="Worker preparing food at the grill">
    <path d="M708 452v-78q0-24 24-24h26q24 0 24 24v78z" fill="#1c1718"/>
    <rect x="722" y="360" width="46" height="92" fill="#2e2728"/>
    <rect x="735" y="336" width="20" height="18" fill="#5a3320"/>
    <circle cx="745" cy="320" r="24" fill="#5a3320"/>
    <path d="M721 314q2-26 24-26t24 26z" fill="#130f0f"/>
    <path d="M760 310h26q4 0 4 5h-30z" fill="#130f0f"/>
    <path d="M708 380q-24 8-34 18" stroke="#5a3320" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M676 396l-16-6" stroke="#9aa2a8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <rect x="660" y="402" width="180" height="16" fill="#2b2527"/>
  <rect x="660" y="396" width="180" height="8" fill="#55504e"/>
  <!-- food on the flat-top: chopped steak and sliced mushrooms -->
  <path d="M676 396q10-10 22 0q10-9 22 0q12-10 24 0" fill="#7a4a2c"/>
  <ellipse cx="770" cy="394" rx="9" ry="5" fill="#cdb38d"/><ellipse cx="788" cy="395" rx="8" ry="5" fill="#cdb38d"/>
  <path class="steam s1" d="M690 382q-8-14 0-26t0-24"/>
  <path class="steam s2" d="M740 380q-8-14 0-26t0-24"/>
  <path class="steam s3" d="M790 382q-8-14 0-26t0-24"/>

  <!-- Person 1: woman leading at the window (owner/lead position) -->
  <g data-person="owner" aria-label="Woman leading service at the window">
    <path d="M478 452v-86q0-26 26-26h34q26 0 26 26v86z" fill="#130f0f"/>
    <path d="M500 364h48v88h-48z" fill="#211919"/>
    <text class="small" x="524" y="410" font-size="16" text-anchor="middle" fill="#e51b2b">CB</text>
    <rect x="512" y="328" width="22" height="18" fill="#7a4a30"/>
    <circle cx="523" cy="310" r="25" fill="#7a4a30"/>
    <path d="M497 312q-2-34 26-36q30 0 28 34q-6-14-26-16q-20 2-28 18z" fill="#c8102e"/>
    <path d="M547 300q14 4 12 22" stroke="#c8102e" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M556 384q30 20 46 52" stroke="#7a4a30" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Counter with a paper-wrapped cheesesteak in a checkered basket -->
  <rect x="396" y="448" width="468" height="16" fill="url(#steel)"/>
  <path d="M574 448l10-26h96l10 26z" fill="url(#checker)" stroke="#130f0f" stroke-width="2"/>
  <rect x="590" y="416" width="84" height="22" rx="11" fill="#f4ecdc" stroke="#d8cdb8" stroke-width="2"/>
  <ellipse cx="674" cy="427" rx="8" ry="11" fill="#e8c48f"/>
  <ellipse cx="674" cy="427" rx="5" ry="7" fill="#7a4a2c"/>

  <!-- Menu board: no prices until College Boy confirms them -->
  <rect x="890" y="296" width="150" height="150" fill="#130f0f" stroke="#fffdf8" stroke-width="4"/>
  <text class="small" x="965" y="336" font-size="22" text-anchor="middle" fill="#ffcc45">TODAY’S</text>
  <text class="small" x="965" y="364" font-size="22" text-anchor="middle" fill="#ffcc45">MENU</text>
  <text class="small" x="965" y="402" font-size="15" text-anchor="middle" fill="#fffdf8">ASK AT THE</text>
  <text class="small" x="965" y="424" font-size="15" text-anchor="middle" fill="#fffdf8">WINDOW</text>

  <!-- Lower panel -->
  <rect x="372" y="468" width="478" height="26" fill="#130f0f"/>
  <text class="small" x="611" y="486" font-size="14" style="letter-spacing:1.5px" text-anchor="middle" fill="#fffdf8">REAL PHILLY CHEESESTEAKS · WHEREVER WE ROLL</text>

  <!-- Wheels -->
  <g fill="#130f0f"><circle cx="220" cy="546" r="52"/><circle cx="930" cy="546" r="52"/></g>
  <g fill="url(#steel)"><circle cx="220" cy="546" r="24"/><circle cx="930" cy="546" r="24"/></g>
  <g fill="#55504e"><circle cx="220" cy="546" r="8"/><circle cx="930" cy="546" r="8"/></g>
  <rect x="1060" y="300" width="14" height="40" rx="4" fill="#ff5a5f"/>
</svg>
